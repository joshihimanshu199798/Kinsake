name: Web checks
on:
  pull_request:
  push:
    branches: [main, feature/kinsake-complete-suite-phase-1, fix/exif-sub-ifd-date-fallback]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run build
